<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Labels</title>
  <style>
    :root { --bg: #ffffff; --text: #111; --muted: #555; --border: #bbb; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #14161a; --text: #e6e8eb; --muted: #9aa1ab; --border: #444; }
    }
    :root[data-theme="dark"] { --bg: #14161a; --text: #e6e8eb; --muted: #9aa1ab; --border: #444; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
    .controls label { display: flex; gap: 6px; align-items: center; }
    .controls input { width: 70px; }
    .muted { color: var(--muted); }
    .sheet { display: flex; flex-wrap: wrap; gap: 2mm; }
    /* Labels always print black on white so they read on any bin color. */
    .label {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      padding: 0 1.5mm 0 4mm;
      border: 0.2mm dashed #888;
      background: #fff;
      color: #000;
      font-family: "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-stretch: condensed;
    }
    .label .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 2.5mm; }
    .label .l1 { font-weight: 700; white-space: nowrap; line-height: 1.05; }
    .label .l2 { white-space: nowrap; line-height: 1.1; }
    @media print {
      @page { margin: 8mm; }
      body { padding: 0; background: #fff; }
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <strong>Paper labels</strong>
    <label>Default width <input id="w" type="number" min="15" max="300" step="0.5" value="72"> mm</label>
    <label>Height <input id="h" type="number" min="6" max="60" step="0.5" value="14"> mm</label>
    <label><input id="useCard" type="checkbox" checked> Use each item's slot size when known</label>
    <button id="print" type="button">Print</button>
    <span class="muted">Print at 100% scale (no "fit to page"). Cut on the dashed lines. Slot sizes are learned when you press Make on an item. Defaults: Settings &gt; Paper labels.</span>
  </div>
  <div id="sheet" class="sheet"></div>
  <script type="module" src="/labels.js"></script>
</body>
</html>
